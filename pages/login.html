
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Queue</title>

    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <header>

        <!-- Navbar -->
        <nav class="navbar">

            <!-- Logo -->
            <a href="../index.html" class="logo">
                <img src="../asstes/imgs/logo.png" alt="Smart Queue Logo">
                <h2>Smart<span>Queue</span></h2>
            </a>

            <!-- Navigation Links -->
            <div class="links">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../index.html#about">About Museum</a></li>
                    <li><a href="../index.html#how-it-works">How It Works</a></li>
                    <li><a href="login.html">Book A Visit</a></li>
                </ul>
            </div>

            <!-- Navbar Buttons -->
            <div class="button-nav">
                <a href="login.html" class="button1">Log In</a>
                <a href="register.html" class="button2">Sign Up</a>
                <a href="../visitor/booking.html" class="button3">Book Now</a>
            </div>

        </nav>

    </header>

    <main>

        <!-- Login Section -->
        <section class="login-section">

            <div class="login-card">

                <h1>Welcome Back!</h1>

                <p class="login-subtitle">
                    Log in to your Smart Queue account
                </p>

                <!-- Login Form -->
                <form id="login-form">

                    <!-- Email -->
                    <div class="input-group">
                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <!-- Login Options -->
                    <div class="login-options">
                        <label>
                            <input type="checkbox" id="remember-me">
                            Remember Me
                        </label>

                        <a href="#">Forgot Password?</a>
                    </div>

                    <!-- Error Message -->
                    <p id="login-error" role="alert"></p>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn">
                        Log In →
                    </button>

                </form>

                <!-- Sign Up Link -->
                <p class="signup-text">
                    Don't have an account?
                    <a href="register.html">Sign Up</a>
                </p>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="the-footer">

        <a href="../index.html" class="footer-logo">
            <img src="../asstes/imgs/logo.png" alt="Smart Queue Logo">
            <h2>Smart<span>Queue</span></h2>
        </a>

        <p>
            © 2026 Smart Queue. Making every museum visit easier,
            faster, and more enjoyable.
        </p>

    </footer>

    <script src="../js/login.js"></script>

</body>
</html>
